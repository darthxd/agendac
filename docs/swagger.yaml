basePath: /api/v1
definitions:
  internal_task.CreateRequest:
    properties:
      color:
        type: string
      description:
        type: string
      finish_at:
        type: string
      priority:
        type: string
      status:
        type: string
      title:
        type: string
      user_id:
        type: integer
    type: object
  internal_task.ErrorResponse:
    properties:
      message:
        example: descrição do erro
        type: string
    type: object
  internal_task.MessageResponse:
    properties:
      message:
        example: usuário com id 1 deletado com sucesso
        type: string
    type: object
  internal_task.NewRequest:
    properties:
      color:
        type: string
      description:
        type: string
      finish_at:
        type: string
      priority:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  internal_task.TaskResponse:
    properties:
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      finish_at:
        type: string
      id:
        type: integer
      priority:
        type: string
      status:
        type: string
      title:
        type: string
      user_id:
        type: integer
    type: object
  internal_task.UpdateRequest:
    properties:
      color:
        type: string
      description:
        type: string
      finish_at:
        type: string
      priority:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  internal_user.CreateRequest:
    properties:
      email:
        example: joao@email.com
        type: string
      name:
        example: João Silva
        type: string
      password:
        example: senha123
        type: string
      role:
        enum:
        - default
        - admin
        example: default
        type: string
    type: object
  internal_user.ErrorResponse:
    properties:
      message:
        example: descrição do erro
        type: string
    type: object
  internal_user.LoginRequest:
    properties:
      email:
        example: joao@email.com
        type: string
      password:
        example: senha123
        type: string
    type: object
  internal_user.LoginResponse:
    properties:
      email:
        example: joao@email.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: João Silva
        type: string
      role:
        example: default
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  internal_user.MessageResponse:
    properties:
      message:
        example: usuário com id 1 deletado com sucesso
        type: string
    type: object
  internal_user.RegisterRequest:
    properties:
      email:
        example: joao@email.com
        type: string
      name:
        example: João Silva
        type: string
      password:
        example: senha123
        type: string
    type: object
  internal_user.UpdateRequest:
    properties:
      email:
        example: joao@email.com
        type: string
      name:
        example: João Silva
        type: string
      password:
        example: novaSenha123
        type: string
      role:
        enum:
        - default
        - admin
        example: default
        type: string
    type: object
  internal_user.UserResponse:
    properties:
      email:
        example: joao@email.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: João Silva
        type: string
      role:
        example: default
        type: string
    type: object
info:
  contact: {}
  description: API de agenda para PI-II.
  title: ApiAgenda
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Faz o login do usuário recebendo email e senha e retorna o usuário
        e o token jwt
      parameters:
      - description: Credenciais
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Faz o registro do usuário, sempre com role default, e o retorna
      parameters:
      - description: Dados do usuário
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_user.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
      summary: Registrar usuário
      tags:
      - auth
  /tasks:
    get:
      description: Retorna uma lista com todas as tarefas cadastradas
      parameters:
      - description: status da tarefa
        in: query
        name: status
        type: string
      - description: priority da tarefa
        in: query
        name: priority
        type: string
      - description: id do usuário
        in: query
        name: user_id
        type: integer
      - description: termo para pesquisa (titulo e descrição)
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_task.TaskResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar tarefas
      tags:
      - tasks
    post:
      description: Cria uma nova tarefa. Requer admin
      parameters:
      - description: Dados da tarefa
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_task.CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_task.TaskResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar tarefa
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Deleta a tarefa com o id passado na url. Caso o usuário não seja
        admin, ele só pode deletar suas próprias tarefas
      parameters:
      - description: ID da tarefa
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_task.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deletar tarefa
      tags:
      - tasks
    get:
      description: Retorna a tarefa com o id passado na url. Requer permissão de admin
      parameters:
      - description: ID da tarefa
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_task.TaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Buscar tarefa por id
      tags:
      - tasks
    patch:
      description: Atualiza uma tarefa. Caso o usuário não seja admin, ele só pode
        alterar suas próprias tarefas
      parameters:
      - description: ID da tarefa
        in: path
        name: id
        required: true
        type: integer
      - description: Dados da tarefa
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_task.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_task.TaskResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualiza tarefa
      tags:
      - tasks
  /tasks/new:
    post:
      description: Cria uma nova tarefa relacionada ao usuário salvo no token jwt
      parameters:
      - description: Dados da tarefa
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_task.NewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_task.TaskResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar tarefa para usuário autenticado
      tags:
      - tasks
  /users:
    get:
      description: Retorna uma lista com todos os usuários cadastrados
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_user.UserResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar usuários
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Cria um novo usuário e o retorna. Requer permissão de admin
      parameters:
      - description: Dados do usuário
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_user.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar usuário
      tags:
      - users
  /users/{id}:
    delete:
      description: Deleta o usuário com o id passado na url. Requer permissão de admin
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deletar usuário
      tags:
      - users
    get:
      description: Retorna o usuário com o id passado na url. Requer permissão de
        admin
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Buscar usuário por id
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Atualiza o usuário com o id passado na url e o retorna. Requer
        permissão de admin
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: integer
      - description: Campos a serem atualizados
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_user.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar usuário
      tags:
      - users
  /users/me:
    get:
      description: Retorna o usuário salvo no jwt da requisição
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Buscar usuário autenticado
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Atualiza o usuário salvo no jwt da requisição. Um usuário só pode
        alterar seu role caso ele mesmo seja admin
      parameters:
      - description: Campos a serem atualizados
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_user.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar usuário autenticado
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'Informe o token JWT no formato: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
